<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WC2026">
<meta name="theme-color" content="#07101e">
<title>WC2026 AI Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07101e;--card:#0b1c30;--border:#0e2236;
  --text:#e2e8f0;--sub:#64748b;--dim:#2d5070;
  --red:#c8102e;--green:#22c55e;--amber:#f59e0b;--blue:#60a5fa;
  --claude:#fbbf24;--chatgpt:#34d399;--gemini:#60a5fa;--grok:#f87171;
}
html,body{background:var(--bg);min-height:100vh}
body{font-family:-apple-system,"SF Pro Display",Arial,sans-serif;max-width:480px;margin:0 auto;padding-bottom:90px;color:var(--text);overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}

.hdr{background:linear-gradient(150deg,#9b0b20,#5c000f);padding:14px 16px 12px;position:sticky;top:0;z-index:50;box-shadow:0 2px 20px rgba(0,0,0,.5)}
.hdr-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.hdr-title{font-size:15px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.05em}
.hdr-sub{font-size:9px;color:rgba(255,255,255,.55);margin-top:3px;letter-spacing:.06em}
.hdr-right{font-size:8px;color:rgba(255,255,255,.3);text-align:right;line-height:1.6}
.sb{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.sbc{background:rgba(0,0,0,.3);border-radius:8px;padding:7px 4px;text-align:center;border:1px solid transparent}
.sbc.lead{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.07)}
.sbc-name{font-size:9px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.sbc-pts{font-size:20px;font-weight:800;line-height:1}
.sbc-sub{font-size:8px;color:rgba(255,255,255,.3);margin-top:1px}

.auto-badge{display:inline-flex;align-items:center;gap:4px;font-size:8px;padding:2px 8px;border-radius:20px;background:#052e16;color:var(--green);margin-left:6px;vertical-align:middle}
.auto-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.tabs{display:flex;background:#030912;border-bottom:1px solid var(--border);position:sticky;top:99px;z-index:40}
.tab{flex:1;padding:9px 2px;text-align:center;font-size:10px;font-weight:700;color:var(--dim);border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.05em;transition:all .2s}
.tab.on{color:#fff;border-bottom-color:var(--red)}

.filters{display:flex;gap:6px;padding:10px 12px 4px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fb{padding:4px 14px;border-radius:20px;font-size:10px;font-weight:700;border:none;white-space:nowrap;flex-shrink:0}
.fb.on{background:var(--red);color:#fff}
.fb.off{background:var(--card);color:var(--dim)}

.gen-banner{background:#0d1f34;border:1px solid var(--amber);border-radius:10px;margin:6px 12px;padding:9px 12px;display:flex;align-items:center;gap:10px}
.spin{animation:spin 1.2s linear infinite;display:inline-block;font-size:15px}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-text{font-size:11px;font-weight:600;color:var(--amber)}
.gen-sub{font-size:9px;color:var(--dim);margin-top:1px}

.day-band{font-size:9px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;padding:12px 12px 4px;border-top:1px solid var(--border);margin-top:4px}
.day-band:first-child{border-top:none;margin-top:0}

.gc{background:var(--card);border-radius:12px;padding:11px 12px;margin:0 12px 8px;border-left:3px solid var(--amber);transition:border-color .3s}
.gc.done{border-left-color:var(--green)}
.gc.generating{border-left-color:#818cf8}
.gc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.gc-group{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.gc-badge{font-size:9px;padding:2px 8px;border-radius:20px;font-weight:700}
.b-final{background:#052e16;color:var(--green)}
.b-pending{background:#1c1003;color:var(--amber)}
.b-gen{background:#1e1b4b;color:#818cf8}

.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:7px}
.team{text-align:center}
.flag{font-size:22px;display:block;margin-bottom:2px;line-height:1.1}
.tname{font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.03em}
.score-blk{text-align:center}
.score-main{font-size:19px;font-weight:800;letter-spacing:1px;line-height:1}
.score-actual{font-size:11px;font-weight:800;color:var(--blue);margin-top:3px}
.score-lbl{font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-top:1px}

.xg-wrap{margin-bottom:6px}
.xg-labels{display:flex;justify-content:space-between;font-size:8px;color:var(--dim);margin-bottom:2px}
.xg-labels b{color:#94a3b8}
.xg-c{font-size:9px;color:var(--blue);font-weight:700}
.xg-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;display:flex}
.xg-h{background:#3b82f6;transition:width .6s}
.xg-a{background:#ef4444;flex:1}

.odds-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px}
.op{font-size:9px;background:#040c1a;border-radius:20px;padding:2px 7px;color:var(--dim)}
.op b{color:#94a3b8}
.op.sc{color:var(--blue)}

.ai-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:7px}
.ai-box{background:#040c1a;border-radius:6px;padding:5px 3px;text-align:center}
.ai-nm{font-size:8px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.ai-pk{font-size:9px;font-weight:600;color:var(--sub);margin-bottom:2px;line-height:1.2;min-height:22px}
.ai-ic{font-size:10px}

.vbet{background:#030912;border-radius:8px;padding:7px 9px;border:.5px solid var(--border);margin-bottom:6px}
.vbet-lbl{font-size:8px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.vbet-desc{font-size:11px;font-weight:700;margin-bottom:5px}
.vbet-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vs{text-align:center}
.vs-n{font-size:14px;font-weight:800;line-height:1}
.vs-l{font-size:8px;color:var(--dim);text-transform:uppercase;margin-top:1px}
.vsep{width:.5px;height:22px;background:var(--border);flex-shrink:0}

.exact-row{display:flex;align-items:center;gap:6px;padding:5px 0 2px;border-top:.5px solid var(--border);margin-top:4px}
.exact-lbl{font-size:9px;color:var(--dim);flex:1}
.exact-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px}
.exact-hit{background:#052e16;color:var(--green)}
.exact-miss{background:#1c0505;color:#ef4444}

.intel-btn{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;padding:5px 0 0;display:block;text-align:left}
.intel-body{background:#030912;border-radius:6px;padding:7px 9px;margin-top:4px;font-size:10px;color:var(--sub);line-height:1.6;border:.5px solid var(--border)}
.intel-body b{color:#94a3b8}

.confidence{display:inline-block;font-size:8px;padding:1px 7px;border-radius:20px;margin-left:6px;font-weight:700}
.conf-high{background:#052e16;color:var(--green)}
.conf-medium{background:#1c1003;color:var(--amber)}
.conf-low{background:#1c0505;color:#ef4444}

.lesson{background:var(--card);border-radius:12px;padding:12px;margin:0 12px 8px;border-left:3px solid var(--dim)}
.lesson.hit{border-left-color:var(--green)}
.lesson.miss{border-left-color:#ef4444}
.lesson.mixed{border-left-color:var(--amber)}
.lesson-hdr{cursor:pointer}
.lesson-game{font-size:11px;font-weight:700;margin-bottom:3px}
.lesson-head{font-size:10px;color:var(--blue);font-weight:600;margin-bottom:5px}
.lesson-tags{display:flex;flex-wrap:wrap;gap:3px}
.ltag{font-size:8px;padding:2px 7px;border-radius:20px;font-weight:700}
.lesson-body{display:none;margin-top:8px;padding-top:8px;border-top:.5px solid var(--border)}
.lesson.open .lesson-body{display:block}
.ls-t{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.ls-b{font-size:10px;color:var(--sub);line-height:1.6;margin-bottom:8px}
.opinion-box{background:#040c1a;border-radius:6px;padding:8px;margin-top:4px;border-left:3px solid var(--amber)}
.opinion-lbl{font-size:8px;color:var(--amber);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.opinion-txt{font-size:10px;color:#94a3b8;line-height:1.6}

.stat-card{background:var(--card);border-radius:12px;padding:12px;margin:0 12px 8px}
.stat-title{font-size:11px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.stat-big{font-size:36px;font-weight:800;color:var(--claude);text-align:center;line-height:1}
.stat-sub{font-size:10px;color:var(--dim);text-align:center;margin:4px 0 10px}
.stat-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:10px}
.stat-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--amber),var(--green))}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:.5px solid var(--border);font-size:9px}
.stat-hit{color:var(--green);font-weight:700}
.stat-miss{color:#ef4444;font-weight:700}

.lb-wrap{background:var(--card);border-radius:12px;overflow:hidden;margin:0 12px 10px}
.lb-hdr{display:grid;grid-template-columns:28px 1fr 44px 44px 44px;padding:7px 12px;background:#040c1a;font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.lb-row{display:grid;grid-template-columns:28px 1fr 44px 44px 44px;padding:10px 12px;border-top:1px solid var(--border);align-items:center}
.lb-row.gold{background:#0e1f33}
.lb-rank{font-size:14px;font-weight:800}
.lb-bar-w{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:3px;width:60px}
.lb-bar-f{height:100%;border-radius:2px;transition:width .5s}
.lb-n{text-align:center;font-size:13px;font-weight:800}
.lb-p{text-align:center;font-size:11px}

.info-card{background:var(--card);border-radius:12px;padding:12px;margin:0 12px 10px}
.info-title{font-size:11px;font-weight:700;margin-bottom:6px}
.info-body{font-size:9px;color:var(--dim);line-height:2}

.share-card{background:var(--card);border-radius:12px;padding:14px;margin:0 12px 10px}
.share-title{font-size:13px;font-weight:700;margin-bottom:10px}
.share-step{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}
.share-num{width:22px;height:22px;border-radius:11px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;flex-shrink:0;flex-shrink:0}
.share-text{font-size:11px;color:var(--sub);line-height:1.5}
.share-text b{color:var(--text)}
.big-btn{width:100%;padding:13px;border-radius:10px;color:#fff;font-size:13px;font-weight:700;border:none;margin-top:6px;cursor:pointer}
.btn-teal{background:#00ad9f}
.btn-red{background:var(--red)}
.share-info{font-size:9px;color:var(--dim);line-height:2;margin-top:8px}
.code-block{background:#030912;border-radius:8px;padding:10px 12px;font-family:monospace;font-size:11px;color:var(--green);margin:8px 0;border:.5px solid var(--border);word-break:break-all}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;font-size:11px;font-weight:700;padding:8px 18px;border-radius:20px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid var(--border)}
.toast.show{opacity:1}
</style>
</head>

// ── HELPERS ──────────────────────────────────────────────────
const gk=m=>`${m.h}|${m.a}`;
const getResult=m=>LIVE_DATA[gk(m)]||KNOWN_RESULTS[gk(m)]||null;
const parseWinner=r=>{ if(!r) return null; const [h,a]=r.split("-").map(Number); return h>a?"home":a>h?"away":"draw"; };

function claudeWinHit(m,pred){
  const r=getResult(m); if(!r||!pred) return null;
  const actual=parseWinner(r);
  const pick=(pred.pick||"").toLowerCase();
  const home=dn(m.h).toLowerCase(), away=dn(m.a).toLowerCase();
  if(pick==="draw") return actual==="draw";
  if(pick.includes(home)||home.includes(pick)) return actual==="home";
  if(pick.includes(away)||away.includes(pick)) return actual==="away";
  return false;
}
function otherWinHit(m,predStr){
  const r=getResult(m); if(!r||!predStr) return null;
  const p=predStr.toLowerCase(), actual=parseWinner(r);
  const home=dn(m.h).toLowerCase(), away=dn(m.a).toLowerCase();
  if(p.includes("draw")) return actual==="draw";
  if(p.includes(home)) return actual==="home";
  if(p.includes(away)) return actual==="away";
  return null;
}
function exactHit(m,pred){
  const r=getResult(m); if(!r||!pred?.score) return null;
  return r===pred.score;
}
function getProp(m){ const k=gk(m); return KNOWN_PROPS[k]!==undefined?KNOWN_PROPS[k]:null; }

function calcScores(){
  const pts={claude:0,chatgpt:0,gemini:0,grok:0};
  const pl={claude:0,chatgpt:0,gemini:0,grok:0};
  const exact={hits:0,total:0,games:[]};
  ALL_FIXTURES.forEach(m=>{
    const r=getResult(m); if(!r) return;
    const pred=PRED_CACHE[gk(m)];
    const cw=claudeWinHit(m,pred);
    if(cw===true) pts.claude++; pl.claude++;
    const ph=getProp(m);
    if(ph===true) pts.claude++;
    if(ph!==null) pl.claude++;
    const ex=exactHit(m,pred);
    if(ex!==null){ exact.total++; if(ex) exact.hits++; }
    exact.games.push({m,pred,r,hit:ex});
    ["chatgpt","gemini","grok"].forEach(ai=>{
      const h=otherWinHit(m,pred?.aiPicks?.[ai]);
      if(h===true) pts[ai]++; if(h!==null) pl[ai]++;
    });
  });
  return {pts,pl,exact};
}

// ── AUTO-PREDICTION via Netlify Function ─────────────────────
async function generatePrediction(m){
  const k=gk(m);
  if(PRED_CACHE[k]||GENERATING[k]) return;
  GENERATING[k]=true;
  render();

  // Build context
  const homeResults=Object.entries(KNOWN_RESULTS).filter(([k2])=>k2.startsWith(m.h+"|")||k2.endsWith("|"+m.h)).map(([k2,v])=>`${k2.replace("|"," vs ")}=${v}`).join(", ")||"no prior games";
  const awayResults=Object.entries(KNOWN_RESULTS).filter(([k2])=>k2.startsWith(m.a+"|")||k2.endsWith("|"+m.a)).map(([k2,v])=>`${k2.replace("|"," vs ")}=${v}`).join(", ")||"no prior games";
  const homeXG=Object.entries(KNOWN_XG).filter(([k2])=>k2.startsWith(m.h+"|")||k2.endsWith("|"+m.h)).map(([k2,v])=>{ const isH=k2.startsWith(m.h+"|"); return `${isH?v.h:v.a} xG`; }).join(", ")||"unknown";
  const awayXG=Object.entries(KNOWN_XG).filter(([k2])=>k2.startsWith(m.a+"|")||k2.endsWith("|"+m.a)).map(([k2,v])=>{ const isH=k2.startsWith(m.a+"|"); return `${isH?v.h:v.a} xG`; }).join(", ")||"unknown";

  const prompt=`You are an AI football analyst predicting WC2026 Group ${m.g} MD${m.md}: ${dn(m.h)} vs ${dn(m.a)} on ${m.date}.

TEAM DATA:
${dn(m.h)}: results=[${homeResults}], xG=[${homeXG}]
${dn(m.a)}: results=[${awayResults}], xG=[${awayXG}]

LEARNED RULES (apply these):
- Mexico home at altitude = +0.4 xG advantage; never back BTTS if Mexico lead
- Opponent xG <0.25 + favourite xG >3.5 = predict 4+ goals minimum
- GK heroics cause regression (Australia true level ~0.77 xG)
- Morocco outperformed Brazil — respect their attacking quality
- Brazil under Ancelotti: structurally unstable, avoid large handicaps
- USA true baseline = 2-goal wins despite 4-1 result
- Sweden more clinical than xG shows (Gyökeres+Isak overperform)
- Spain have finishing problems despite high xG
- Netherlands missing 4 key defenders — weaker than odds suggest
- Don't overthink when market consensus is clear

Respond ONLY with valid JSON (no markdown, no explanation):
{"pick":"${dn(m.h)} OR ${dn(m.a)} OR Draw","score":"H-A","prop":"best value bet description","propOdds":"X.XX×","scoreOdds":"X.XX×","confidence":"high|medium|low","reasoning":"2-3 sentence tactical analysis","aiPicks":{"chatgpt":"prediction","gemini":"Team X-Y score","grok":"prediction"}}`;

  try {
    // Call our Netlify Function proxy — not the Claude API directly
    const resp=await fetch("/.netlify/functions/predict",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:[{role:"user",content:prompt}]})
    });
    const data=await resp.json();
    const text=(data.content||[]).map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
    const jsonMatch=text.match(/\{[\s\S]*\}/);
    if(jsonMatch)
      {PRED_CACHE[k]=JSON.parse(jsonMatch[0]);}else{throw new Error("No JSON");}
  } catch(e){
    PRED_CACHE[k]={pick:dn(m.h),score:"1-0",prop:"Home win",propOdds:"2.0×",scoreOdds:"8.0×",confidence:"low",reasoning:"Prediction generation failed — defaulting to home win.",aiPicks:{chatgpt:dn(m.h)+" win",gemini:dn(m.h)+" 1-0",grok:dn(m.h)+" win"}};
  }
  delete GENERATING[k];
  render();
}

function triggerPredictions(){
  const today=new Date("2026-06-20");
  ALL_FIXTURES.forEach(m=>{
    if(getResult(m)) return;
    const diff=(new Date(m.date)-today)/(864e5);
    if(diff>=-1&&diff<=4) generatePrediction(m);
  });
}

            <div class="vbet-desc">${prop}</div>
            <div class="vbet-row">
              <div class="vs"><div class="vs-n" style="color:${AI_COLOR.claude}">${pOdds}</div><div class="vs-l">Bet odds</div></div>
              <div class="vsep"></div>
              <div class="vs"><div class="vs-n" style="color:var(--blue)">${sOdds}</div><div class="vs-l">${score}</div></div>
              ${done?`<div class="vsep"></div><div class="vs">
                <div class="vs-n" style="color:${ph===true?"var(--green)":ph===false?"#ef4444":"var(--dim)"}">${ph===true?"HIT ✅":ph===false?"MISS ❌":"?"}</div>
                <div class="vs-l">Prop</div>
              </div>`:""}
            </div>
            ${done?`<div class="exact-row">
              <span class="exact-lbl">🎯 Exact score (${score}):</span>
              <span class="exact-badge ${ex===true?"exact-hit":"exact-miss"}">${ex===true?"✅ NAILED IT":"❌ Was "+result}</span>
            </div>`:""}
          </div>`:""}
          ${(pred?.reasoning||note)?`
            <button class="intel-btn" onclick="toggleN('${k.replace(/\|/g,"_")}')">
              ${open?"▼":"▶"} Claude's analysis${xg?` · xG ${xg.h}–${xg.a}`:""}
            </button>
            ${open?`<div class="intel-body">${pred?.reasoning?`<b>🤖 Reasoning:</b> ${pred.reasoning}<br><br>`:""}${note?`<b>📊 Match intel:</b> ${note}`:""}</div>`:""}`:""}
        </div>`;
      });
    });
  }

  else if(TAB==="lessons"){
    html+=`<div style="padding:10px 12px 6px;font-size:10px;color:var(--dim);line-height:1.6">Built from xG data, pressing stats, and multi-source match reports. Claude's own opinions and learning curve included. Applied automatically to every prediction.</div>`;
    LESSONS.forEach((l,i)=>{
      const isOpen=OPEN_LESSON===i;
      const tc=l.type==="hit"?"var(--green)":l.type==="miss"?"#ef4444":"var(--amber)";
      const bg=l.type==="hit"?"#052e16":l.type==="miss"?"#1c0505":"#1c1003";
      html+=`<div class="lesson ${l.type}${isOpen?" open":""}">
        <div class="lesson-hdr" onclick="toggleL(${i})">
          <div class="lesson-game">${l.g} <span style="font-size:9px;padding:1px 6px;border-radius:10px;background:${bg};color:${tc};font-weight:700;margin-left:4px">MD${l.md} ${l.type==="hit"?"✅":"❌"}</span></div>
          <div class="lesson-head">${l.head}</div>
          <div class="lesson-tags">${l.tags.map(t=>`<span class="ltag" style="background:${tc}22;color:${tc}">${t}</span>`).join("")}</div>
        </div>
        <div class="lesson-body">
          <div class="ls-t" style="color:var(--amber)">📊 xG & Stats</div><div class="ls-b">${l.xg}</div>
          <div class="ls-t" style="color:var(--blue)">🎯 Tactical Analysis</div><div class="ls-b">${l.tac}</div>
          <div class="ls-t" style="color:var(--green)">🧠 Applied Lesson</div><div class="ls-b">${l.lesson}</div>
          <div class="opinion-box"><div class="opinion-lbl">💬 Claude's Own Opinion</div><div class="opinion-txt">${l.opinion}</div></div>
        </div>
      </div>`;
    });
  }

  else if(TAB==="board"){
    const {pts:p2,pl:pl2,exact:ex2}=calcScores();
    const lb2=["claude","chatgpt","gemini","grok"].map(ai=>({ai,pts:p2[ai],pl:pl2[ai],pct:pl2[ai]?Math.round(p2[ai]/pl2[ai]*100):0})).sort((a,b)=>b.pts-a.pts||b.pct-a.pct);
    const exactPct=ex2.total?Math.round(ex2.hits/ex2.total*100):0;
    html+=`<div style="height:8px"></div>
    <div class="stat-card">
      <div class="stat-title">🎯 Exact Score Tracker <span style="font-size:9px;color:var(--dim);font-weight:400">Claude only</span></div>
      <div class="stat-big">${ex2.hits}/${ex2.total}</div>
      <div class="stat-sub">${exactPct}% exact score hit rate</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:${exactPct}%"></div></div>
      ${ex2.games.filter(g=>g.r).map(({m,pred,r,hit})=>`
        <div class="stat-row">
          <span style="color:var(--sub)">${fl(m.h)} ${dn(m.h)} vs ${dn(m.a)} ${fl(m.a)}</span>
          <span class="${hit?"stat-hit":"stat-miss"}">${pred?.score||"?"}→${r} ${hit?"✅":"❌"}</span>
        </div>`).join("")}
    </div>
    <div class="lb-wrap">
      <div class="lb-hdr"><div>#</div><div>AI</div><div style="text-align:center">Pts</div><div style="text-align:center">Games</div><div style="text-align:center">%</div></div>
      ${lb2.map(({ai,pts:p,pl:played,pct},i)=>`
        <div class="lb-row${i===0?" gold":""}">
          <div class="lb-rank" style="color:${i===0?"#fbbf24":i===1?"#94a3b8":i===2?"#cd7f32":"var(--dim)"}">${i+1}</div>
          <div><div style="font-size:11px;font-weight:700;color:${AI_COLOR[ai]}">${AI_LABEL[ai]}</div>
            <div class="lb-bar-w"><div class="lb-bar-f" style="width:${played?Math.round(p/Math.max(played*2,1)*100):0}%;background:${AI_COLOR[ai]}"></div></div></div>
          <div class="lb-n" style="color:${AI_COLOR[ai]}">${p}</div>
          <div class="lb-n" style="color:var(--sub)">${played}</div>
          <div class="lb-p" style="color:${pct>=60?"var(--green)":pct>=40?"var(--amber)":"#ef4444"}">${pct}%</div>
        </div>`).join("")}
    </div>
    <div class="info-card">
      <div class="info-title">📊 Scoring rules</div>
      <div class="info-body">✅ +1 pt — correct winner or draw<br>✅ +1 pt — value prop bet hits (Claude only)<br>🎯 Exact score: bonus stat, tracked separately<br>🤖 All predictions auto-generated by Claude<br>🔄 Scores refresh every 60s from live API</div>
    </div>
    <div class="info-card">
      <div class="info-title">📈 xG Power Rankings</div>
      <div class="info-body">🥇 Germany +3.81 xG diff<br>🥈 Switzerland +2.48<br>🥉 England +2.09<br>⭐ Spain +1.99 (finishing crisis!)<br>⭐ Norway +1.76<br>🌟 Morocco +0.30 (outperformed Brazil)<br>⚠️ Brazil -0.30 (Ancelotti unstable)<br>⚠️ Netherlands +0.19 (4 defenders out)</div>
    </div>`;
  }

  else if(TAB==="share"){
    html=`<div style="height:8px"></div>
    <div class="share-card">
      <div class="share-title">Step 1 — Get your free API key</div>
      ${[["1","Go to <b>console.anthropic.com</b>"],["2","Sign up for free"],["3","Go to API Keys → Create Key"],["4","Copy it — you'll need it in Step 3"]].map(([n,t])=>`<div class="share-step"><div class="share-num">${n}</div><div class="share-text">${t}</div></div>`).join("")}
      <button class="big-btn btn-red" onclick="window.open('https://console.anthropic.com','_blank')">🔑 Get API Key</button>
    </div>
    <div class="share-card">
      <div class="share-title">Step 2 — Deploy to Netlify</div>
      ${[["1","Download the <b>wc2026-tracker folder</b> from this chat (as a zip)"],["2","Go to <b>app.netlify.com</b> → Add new site → Deploy manually"],["3","Drag & drop the entire <b>wc2026-tracker folder</b>"],["4","Your site goes live instantly with a URL like <b>amazing-name-123.netlify.app</b>"]].map(([n,t])=>`<div class="share-step"><div class="share-num">${n}</div><div class="share-text">${t}</div></div>`).join("")}
      <button class="big-btn btn-teal" onclick="window.open('https://app.netlify.com','_blank')">🚀 Open Netlify</button>
    </div>
    <div class="share-card">
      <div class="share-title">Step 3 — Add your API key (one time)</div>
      ${[["1","In Netlify: go to your site → <b>Site configuration → Environment variables</b>"],["2","Click <b>Add a variable</b>"],["3","Key: <b>ANTHROPIC_API_KEY</b>"],["4","Value: paste your API key from Step 1"],["5","Click Save → <b>Trigger a redeploy</b> → done forever!"]].map(([n,t])=>`<div class="share-step"><div class="share-num">${n}</div><div class="share-text">${t}</div></div>`).join("")}
      <div class="code-block">ANTHROPIC_API_KEY = sk-ant-...</div>
    </div>
    <div class="share-card">
      <div class="share-title">📱 Add to iPhone + share</div>
      ${[["1","Open your Netlify URL in <b>Safari</b>"],["2","Tap Share □↑ → <b>Add to Home Screen</b>"],["3","Name it <b>WC2026</b> → Add"],["4","Share the Netlify URL with friends on WhatsApp — they just tap and it works!"]].map(([n,t])=>`<div class="share-step"><div class="share-num">${n}</div><div class="share-text">${t}</div></div>`).join("")}
      <div class="share-info">
        🤖 Predictions auto-generated by Claude — no manual work<br>
        🔄 Scores refresh every 60s from live API<br>
        🧠 Claude learns from each game and applies lessons automatically<br>
        🎯 Exact score tracker updates in real time<br>
        ♾️ Works for all 72 group stage games through June 27
      </div>
    </div>`;
  }

  document.getElementById("content").innerHTML=html;
}

function setTab(t){ TAB=t; render(); window.scrollTo(0,0); }
function setFilter(v){ FILTER=v; render(); }
function toggleL(i){ OPEN_LESSON=OPEN_LESSON===i?null:i; render(); }
function toggleN(k){ OPEN_NOTES[k]=!OPEN_NOTES[k]; render(); }

// ── BOOT ─────────────────────────────────────────────────────
render();
fetchLiveScores();
setInterval(fetchLiveScores, 60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) fetchLiveScores(); });
</script>
</body>
</html>
