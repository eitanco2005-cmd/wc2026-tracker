name: NBA x Winner daily picks

on:
  schedule:
    - cron: "47 15 * * *"   # 17:47 Israel (winter) / 18:47 (summer)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-winner
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nba-winner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nba-winner/requirements.txt

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore ESPN history cache
        uses: actions/cache@v4
        with:
          path: nba-winner/cache
          key: espn-${{ github.run_id }}
          restore-keys: espn-

      - name: Grade yesterday's picks
        run: python run.py settle || true

      - name: Today's picks
        run: python run.py --no-open

      - name: Save picks log and reports
        if: always()
        working-directory: .
        run: |
          git config user.name "nba-winner-bot"
          git config user.email "nba-winner-bot@users.noreply.github.com"
          git add nba-winner/data nba-winner/reports || true
          git diff --cached --quiet || git commit -m "NBA picks $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash || true
          git push || true
